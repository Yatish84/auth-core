openapi: 3.1.0
info:
  title: Vittavaan Auth-Core API
  version: 0.2.0
  description: Shared machine-readable contract for web and future mobile clients.
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      responses:
        "200":
          description: API process is alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      responses:
        "200":
          description: Required services are available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
        "503":
          description: A required service is unavailable.
  /api/v1/auth/signup:
    post:
      operationId: registerEmail
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailSignupRequest"}
      responses:
        "201": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/signup/phone:
    post:
      operationId: registerPhone
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneSignupRequest"}
      responses:
        "201": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/email:
    post:
      operationId: verifyEmail
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailVerificationRequest"}
      responses:
        "200": {$ref: "#/components/responses/Verified"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/email/request:
    post:
      operationId: requestEmailVerification
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailVerificationResendRequest"}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/phone/request:
    post:
      operationId: requestPhoneVerification
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneVerificationRequest"}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/phone/confirm:
    post:
      operationId: confirmPhoneVerification
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneVerificationConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/Verified"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login:
    post:
      operationId: loginPassword
      tags: [login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordLoginRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginDecision"}
        "401": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login/phone/request:
    post:
      operationId: requestPhoneLogin
      tags: [login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneLoginRequest"}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login/phone/confirm:
    post:
      operationId: confirmPhoneLogin
      tags: [login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneLoginConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginDecision"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sso/{provider}/authorize:
    post:
      operationId: authorizeOidc
      tags: [login]
      parameters:
        - $ref: "#/components/parameters/OidcProvider"
      responses:
        "200":
          description: Provider authorization URL with a short-lived state value.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OidcAuthorizationResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sso/{provider}/callback:
    post:
      operationId: completeOidcLogin
      tags: [login]
      parameters:
        - $ref: "#/components/parameters/OidcProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OidcCallbackRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginDecision"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/fallback-options:
    get:
      operationId: getLoginFallbackOptions
      tags: [login]
      parameters:
        - in: query
          name: workflow_token
          required: true
          schema: {type: string, minLength: 20, maxLength: 512}
      responses:
        "200":
          description: Safe methods available to this short-lived login workflow.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FallbackOptionsResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/methods:
    get:
      operationId: getMfaMethods
      tags: [mfa]
      parameters:
        - $ref: "#/components/parameters/WorkflowToken"
      responses:
        "200":
          description: Methods available for this proven login workflow.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaMethodsResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/challenge:
    post:
      operationId: issueMfaChallenge
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaChallengeRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaChallenge"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/challenge/resend:
    post:
      operationId: resendMfaChallenge
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaChallengeTokenRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaChallenge"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfaChallenge
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaVerifyRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/totp/setup:
    post:
      operationId: setupTotp
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpSetupRequest"}
      responses:
        "200":
          description: One-time authenticator enrollment details.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TotpSetupResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/passkeys/options:
    post:
      operationId: createPasskeyRegistrationOptions
      tags: [mfa, passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyRegistrationOptionsRequest"}
      responses:
        "200": {$ref: "#/components/responses/PasskeyOptions"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/passkeys/confirm:
    post:
      operationId: confirmPasskeyRegistration
      tags: [mfa, passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/options:
    post:
      operationId: createPasskeyAuthenticationOptions
      tags: [passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyAuthenticationOptionsRequest"}
      responses:
        "200": {$ref: "#/components/responses/PasskeyOptions"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/verify:
    post:
      operationId: verifyPasskey
      tags: [passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/identities/collision/prove:
    post:
      operationId: proveOidcCollisionOwnership
      tags: [mfa, login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CollisionPasswordProofRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/devices:
    get:
      operationId: listMfaDevices
      tags: [mfa]
      parameters:
        - $ref: "#/components/parameters/WorkflowToken"
      responses:
        "200":
          description: Active security methods without secret material.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaDevicesResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/devices/{mfa_id}:
    delete:
      operationId: revokeMfaDevice
      tags: [mfa]
      parameters:
        - in: path
          name: mfa_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FactorRevokeRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/session:
    post:
      operationId: createSession
      tags: [sessions]
      parameters:
        - {$ref: "#/components/parameters/ClientType"}
        - {$ref: "#/components/parameters/DeviceFingerprint"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSessionRequest"}
      responses:
        "200": {$ref: "#/components/responses/TokenPair"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/refresh:
    post:
      operationId: rotateRefreshToken
      tags: [sessions]
      parameters:
        - {$ref: "#/components/parameters/ClientType"}
        - {$ref: "#/components/parameters/DeviceFingerprint"}
        - in: header
          name: X-CSRF-Token
          required: false
          schema: {type: string}
          description: Required for browser refresh requests and must match the CSRF cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefreshRequest"}
      responses:
        "200": {$ref: "#/components/responses/TokenPair"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      tags: [sessions]
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Current session revoked.}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      tags: [sessions]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: All active sessions revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogoutAllResponse"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Safe active-session metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionsResponse"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sessions/{session_id}:
    delete:
      operationId: revokeSelectedSession
      tags: [sessions]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Selected owned session revoked.}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Private personal workspace and authorized organization workspaces.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspacesResponse"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/organizations:
    post:
      operationId: createOrganization
      tags: [workspaces]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateOrganizationRequest"}
      responses:
        "201":
          description: Organization workspace created with the caller as owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/organizations/{workspace_id}/invitations:
    post:
      operationId: inviteOrganizationMember
      tags: [workspaces]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrganizationInvitationRequest"}
      responses:
        "201":
          description: Hashed, expiring organization invitation created and delivered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationInvitation"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/organizations/invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags: [workspaces]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrganizationInvitationAcceptRequest"}
      responses:
        "200":
          description: Invitation consumed once and catalog-backed membership created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/organizations/{workspace_id}/members:
    get:
      operationId: listOrganizationMembers
      tags: [workspaces]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Masked organization member directory for authorized administrators.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MembersResponse"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/organizations/{workspace_id}/members/{member_user_id}/roles:
    put:
      operationId: replaceOrganizationMemberRole
      tags: [workspaces]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: member_user_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberRoleRequest"}
      responses:
        "200":
          description: Existing roles replaced with one approved catalog role.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/organizations/{workspace_id}/members/{member_user_id}:
    delete:
      operationId: offboardOrganizationMember
      tags: [workspaces]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: workspace_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: member_user_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Membership and organization-scoped access revoked immediately.}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/workspace/switch:
    post:
      operationId: switchWorkspaceContext
      tags: [workspaces]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceSwitchRequest"}
      responses:
        "200":
          description: New short-lived token scoped to a verified personal or organization workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceTokenResponse"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/referrals:
    post:
      operationId: createPersonalReferral
      tags: [referrals]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateReferralRequest"}
      responses:
        "201":
          description: Privacy-safe referral created and delivered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Referral"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listPersonalReferrals
      tags: [referrals]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Caller-owned referral milestones with masked invitee details.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReferralsResponse"}
        "401": {$ref: "#/components/responses/Problem"}
  /.well-known/jwks.json:
    get:
      operationId: getSigningKeys
      tags: [sessions]
      responses:
        "200":
          description: Public JSON Web Keys used to verify access-token signatures.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JwksResponse"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OidcProvider:
      in: path
      name: provider
      required: true
      schema: {type: string, enum: [google, apple, microsoft]}
    WorkflowToken:
      in: query
      name: workflow_token
      required: true
      schema: {type: string, minLength: 20, maxLength: 512}
    ClientType:
      in: header
      name: X-Client-Type
      required: true
      schema: {type: string, enum: [WEB, MOBILE]}
    DeviceFingerprint:
      in: header
      name: X-Device-Fingerprint
      required: true
      schema: {type: string, minLength: 16, maxLength: 512}
  responses:
    Accepted:
      description: Request accepted without exposing account existence.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AcceptedResponse"}
    Verified:
      description: Contact ownership verified.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/VerifiedResponse"}
    Problem:
      description: RFC 7807 problem response.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemResponse"}
    LoginDecision:
      description: Short-lived handoff to MFA or future session issuance; never a token response.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginDecisionResponse"}
    MfaChallenge:
      description: Short-lived MFA challenge without revealing full contact details.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MfaChallengeResponse"}
    MfaCompletion:
      description: Security completion handoff; access and refresh tokens are not issued yet.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MfaCompletionResponse"}
    PasskeyOptions:
      description: Browser-standard WebAuthn public-key options and an opaque challenge token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PasskeyOptionsResponse"}
    TokenPair:
      description: Access token plus client-appropriate refresh delivery metadata.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TokenResponse"}
  schemas:
    EmailSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, given_name, family_name, captcha_token]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        given_name: {type: string, minLength: 1, maxLength: 120}
        family_name: {type: string, minLength: 1, maxLength: 120}
        captcha_token: {type: string, minLength: 1, maxLength: 2048, writeOnly: true}
        referral_token: {type: [string, "null"], minLength: 20, maxLength: 512, writeOnly: true}
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 180}
    Workspace:
      type: object
      additionalProperties: false
      required: [workspace_id, name, slug, workspace_type, roles]
      properties:
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        workspace_type: {type: string, enum: [personal, organization]}
        roles:
          type: array
          items: {type: string}
          uniqueItems: true
    WorkspacesResponse:
      type: object
      additionalProperties: false
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items: {$ref: "#/components/schemas/Workspace"}
    OrganizationInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: {type: string, format: email, maxLength: 320}
        role: {type: string, enum: [MEMBER, VIEWER]}
    OrganizationInvitationAcceptRequest:
      type: object
      additionalProperties: false
      required: [invitation_token]
      properties:
        invitation_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
    OrganizationInvitation:
      type: object
      additionalProperties: false
      required: [invitation_id, workspace_id, invitee_hint, role, state, created_at, expires_at]
      properties:
        invitation_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        invitee_hint: {type: string}
        role: {type: string, enum: [MEMBER, VIEWER]}
        state: {type: string, enum: [pending, accepted, expired, revoked]}
        created_at: {type: string, format: date-time}
