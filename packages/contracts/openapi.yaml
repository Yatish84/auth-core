openapi: 3.1.0
info:
  title: Vittavaan Auth-Core API
  version: 0.1.0
  description: Initial machine-readable contract for the project foundation.
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Confirm that the API process is running.
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Confirm that the API can reach required services.
      responses:
        "200":
          description: Required services are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: At least one required service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    ComponentHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [up, ready, not_ready]
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentHealth"
