openapi: 3.1.0
info:
  title: Vittavaan Auth-Core API
  version: 0.2.0
  description: Shared machine-readable contract for web and future mobile clients.
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      responses:
        "200":
          description: API process is alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      responses:
        "200":
          description: Required services are available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
        "503":
          description: A required service is unavailable.
  /api/v1/auth/signup:
    post:
      operationId: registerEmail
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailSignupRequest"}
      responses:
        "201": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/signup/phone:
    post:
      operationId: registerPhone
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneSignupRequest"}
      responses:
        "201": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/email:
    post:
      operationId: verifyEmail
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailVerificationRequest"}
      responses:
        "200": {$ref: "#/components/responses/Verified"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/email/request:
    post:
      operationId: requestEmailVerification
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailVerificationResendRequest"}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/phone/request:
    post:
      operationId: requestPhoneVerification
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneVerificationRequest"}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/verify/phone/confirm:
    post:
      operationId: confirmPhoneVerification
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneVerificationConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/Verified"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login:
    post:
      operationId: loginPassword
      tags: [login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordLoginRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginDecision"}
        "401": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login/phone/request:
    post:
      operationId: requestPhoneLogin
      tags: [login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneLoginRequest"}
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login/phone/confirm:
    post:
      operationId: confirmPhoneLogin
      tags: [login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneLoginConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginDecision"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sso/{provider}/authorize:
    post:
      operationId: authorizeOidc
      tags: [login]
      parameters:
        - $ref: "#/components/parameters/OidcProvider"
      responses:
        "200":
          description: Provider authorization URL with a short-lived state value.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OidcAuthorizationResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sso/{provider}/callback:
    post:
      operationId: completeOidcLogin
      tags: [login]
      parameters:
        - $ref: "#/components/parameters/OidcProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OidcCallbackRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginDecision"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/fallback-options:
    get:
      operationId: getLoginFallbackOptions
      tags: [login]
      parameters:
        - in: query
          name: workflow_token
          required: true
          schema: {type: string, minLength: 20, maxLength: 512}
      responses:
        "200":
          description: Safe methods available to this short-lived login workflow.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FallbackOptionsResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/methods:
    get:
      operationId: getMfaMethods
      tags: [mfa]
      parameters:
        - $ref: "#/components/parameters/WorkflowToken"
      responses:
        "200":
          description: Methods available for this proven login workflow.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaMethodsResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/challenge:
    post:
      operationId: issueMfaChallenge
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaChallengeRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaChallenge"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/challenge/resend:
    post:
      operationId: resendMfaChallenge
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaChallengeTokenRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaChallenge"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfaChallenge
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaVerifyRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/totp/setup:
    post:
      operationId: setupTotp
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpSetupRequest"}
      responses:
        "200":
          description: One-time authenticator enrollment details.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TotpSetupResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/passkeys/options:
    post:
      operationId: createPasskeyRegistrationOptions
      tags: [mfa, passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyRegistrationOptionsRequest"}
      responses:
        "200": {$ref: "#/components/responses/PasskeyOptions"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/passkeys/confirm:
    post:
      operationId: confirmPasskeyRegistration
      tags: [mfa, passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/options:
    post:
      operationId: createPasskeyAuthenticationOptions
      tags: [passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyAuthenticationOptionsRequest"}
      responses:
        "200": {$ref: "#/components/responses/PasskeyOptions"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/verify:
    post:
      operationId: verifyPasskey
      tags: [passkeys]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/identities/collision/prove:
    post:
      operationId: proveOidcCollisionOwnership
      tags: [mfa, login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CollisionPasswordProofRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/devices:
    get:
      operationId: listMfaDevices
      tags: [mfa]
      parameters:
        - $ref: "#/components/parameters/WorkflowToken"
      responses:
        "200":
          description: Active security methods without secret material.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaDevicesResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/devices/{mfa_id}:
    delete:
      operationId: revokeMfaDevice
      tags: [mfa]
      parameters:
        - in: path
          name: mfa_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FactorRevokeRequest"}
      responses:
        "200": {$ref: "#/components/responses/MfaCompletion"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
components:
  parameters:
    OidcProvider:
      in: path
      name: provider
      required: true
      schema: {type: string, enum: [google, apple, microsoft]}
    WorkflowToken:
      in: query
      name: workflow_token
      required: true
      schema: {type: string, minLength: 20, maxLength: 512}
  responses:
    Accepted:
      description: Request accepted without exposing account existence.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AcceptedResponse"}
    Verified:
      description: Contact ownership verified.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/VerifiedResponse"}
    Problem:
      description: RFC 7807 problem response.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/ProblemResponse"}
    LoginDecision:
      description: Short-lived handoff to MFA or future session issuance; never a token response.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginDecisionResponse"}
    MfaChallenge:
      description: Short-lived MFA challenge without revealing full contact details.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MfaChallengeResponse"}
    MfaCompletion:
      description: Security completion handoff; access and refresh tokens are not issued yet.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MfaCompletionResponse"}
    PasskeyOptions:
      description: Browser-standard WebAuthn public-key options and an opaque challenge token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PasskeyOptionsResponse"}
  schemas:
    EmailSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, given_name, family_name, captcha_token]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        given_name: {type: string, minLength: 1, maxLength: 120}
        family_name: {type: string, minLength: 1, maxLength: 120}
        captcha_token: {type: string, minLength: 1, maxLength: 2048, writeOnly: true}
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
    EmailVerificationResendRequest:
      type: object
      additionalProperties: false
      required: [email, captcha_token]
      properties:
        email: {type: string, format: email}
        captcha_token: {type: string, writeOnly: true}
    PhoneSignupRequest:
      type: object
      additionalProperties: false
      required: [phone, captcha_token]
      properties:
        phone: {type: string, minLength: 8, maxLength: 32}
        given_name: {type: [string, "null"], minLength: 1, maxLength: 120}
        family_name: {type: [string, "null"], minLength: 1, maxLength: 120}
        captcha_token: {type: string, writeOnly: true}
    PhoneVerificationRequest:
      type: object
      additionalProperties: false
      required: [phone, captcha_token]
      properties:
        phone: {type: string, minLength: 8, maxLength: 32}
        captcha_token: {type: string, writeOnly: true}
    PhoneVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required: [phone, code, captcha_token]
      properties:
        phone: {type: string, minLength: 8, maxLength: 32}
        code: {type: string, pattern: "^[0-9]{6}$", writeOnly: true}
        captcha_token: {type: string, writeOnly: true}
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device_fingerprint]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        device_fingerprint: {type: string, minLength: 16, maxLength: 512, writeOnly: true}
    PhoneLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, captcha_token]
      properties:
        phone: {type: string, minLength: 8, maxLength: 32}
        captcha_token: {type: string, minLength: 1, maxLength: 2048, writeOnly: true}
    PhoneLoginConfirmRequest:
      type: object
      additionalProperties: false
      required: [phone, code, captcha_token, device_fingerprint]
      properties:
        phone: {type: string, minLength: 8, maxLength: 32}
        code: {type: string, pattern: "^[0-9]{6}$", writeOnly: true}
        captcha_token: {type: string, minLength: 1, maxLength: 2048, writeOnly: true}
        device_fingerprint: {type: string, minLength: 16, maxLength: 512, writeOnly: true}
    OidcCallbackRequest:
      type: object
      additionalProperties: false
      required: [state, code, device_fingerprint]
      properties:
        state: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
        code: {type: string, minLength: 20, maxLength: 8192, writeOnly: true}
        device_fingerprint: {type: string, minLength: 16, maxLength: 512, writeOnly: true}
    OidcAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, state]
      properties:
        authorization_url: {type: string, format: uri}
        state: {type: string}
    LoginDecisionResponse:
      type: object
      additionalProperties: false
      required: [decision, risk, workflow_token, allowed_methods]
      properties:
        decision:
          type: string
          enum: [session_ready, mfa_required, collision_proof_required]
        risk: {type: string, enum: [low, medium, high]}
        workflow_token: {type: string}
        allowed_methods:
          type: array
          items: {type: string}
          uniqueItems: true
    FallbackOptionsResponse:
      type: object
      additionalProperties: false
      required: [allowed_methods]
      properties:
        allowed_methods:
          type: array
          items: {type: string}
          uniqueItems: true
    MfaMethod:
      type: string
      enum: [totp, email_otp, sms_otp, passkey, backup_code]
    MfaMethodsResponse:
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: array
          items: {$ref: "#/components/schemas/MfaMethod"}
          uniqueItems: true
    MfaChallengeRequest:
      type: object
      additionalProperties: false
      required: [workflow_token, method]
      properties:
        workflow_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
        method: {$ref: "#/components/schemas/MfaMethod"}
    MfaChallengeTokenRequest:
      type: object
      additionalProperties: false
      required: [challenge_token]
      properties:
        challenge_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
    MfaVerifyRequest:
      allOf:
        - $ref: "#/components/schemas/MfaChallengeTokenRequest"
        - type: object
          required: [code]
          properties:
            code: {type: string, minLength: 6, maxLength: 32, writeOnly: true}
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge_token, method, destination_hint]
      properties:
        challenge_token: {type: string}
        method: {$ref: "#/components/schemas/MfaMethod"}
        destination_hint: {type: [string, "null"]}
    MfaCompletionResponse:
      type: object
      additionalProperties: false
      required: [result, workflow_token, backup_codes]
      properties:
        result: {type: string, enum: [session_ready, identity_linked]}
        workflow_token: {type: [string, "null"]}
        backup_codes:
          type: array
          items: {type: string, writeOnly: true}
    TotpSetupRequest:
      type: object
      additionalProperties: false
      required: [workflow_token]
      properties:
        workflow_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
        label: {type: string, minLength: 1, maxLength: 120, default: Authenticator app}
    TotpSetupResponse:
      type: object
      additionalProperties: false
      required: [enrollment_token, provisioning_uri, manual_secret]
      properties:
        enrollment_token: {type: string}
        provisioning_uri: {type: string, writeOnly: true}
        manual_secret: {type: string, writeOnly: true}
    TotpConfirmRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token, code]
      properties:
        enrollment_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
        code: {type: string, pattern: "^[0-9]{6}$", writeOnly: true}
    PasskeyRegistrationOptionsRequest:
      type: object
      additionalProperties: false
      required: [workflow_token]
      properties:
        workflow_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
        label: {type: string, minLength: 1, maxLength: 120, default: Passkey}
    PasskeyAuthenticationOptionsRequest:
      type: object
      additionalProperties: false
      properties:
        workflow_token: {type: [string, "null"], minLength: 20, maxLength: 512, writeOnly: true}
    PasskeyConfirmRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, credential]
      properties:
        challenge_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
        credential:
          type: object
          additionalProperties: true
    PasskeyOptionsResponse:
      type: object
      additionalProperties: false
      required: [challenge_token, public_key]
      properties:
        challenge_token: {type: string}
        public_key:
          type: object
          additionalProperties: true
    CollisionPasswordProofRequest:
      type: object
      additionalProperties: false
      required: [workflow_token, password]
      properties:
        workflow_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    MfaDevice:
      type: object
      additionalProperties: false
      required: [mfa_id, factor_type, label]
      properties:
        mfa_id: {type: string, format: uuid}
        factor_type: {type: string, enum: [totp, passkey, backup_codes]}
        label: {type: [string, "null"]}
    MfaDevicesResponse:
      type: object
      additionalProperties: false
      required: [factors]
      properties:
        factors:
          type: array
          items: {$ref: "#/components/schemas/MfaDevice"}
    FactorRevokeRequest:
      type: object
      additionalProperties: false
      required: [workflow_token]
      properties:
        workflow_token: {type: string, minLength: 20, maxLength: 512, writeOnly: true}
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status: {type: string, const: accepted}
        message: {type: string}
    VerifiedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: verified}
    ProblemResponse:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        request_id: {type: string, format: uuid}
    ComponentHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [up, down]}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service: {type: string}
        status: {type: string, enum: [up, ready, not_ready]}
        components:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ComponentHealth"}
