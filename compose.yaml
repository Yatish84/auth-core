name: auth-core

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_core}
      POSTGRES_USER: ${POSTGRES_USER:-auth_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_core} -d ${POSTGRES_DB:-auth_core}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  migrate:
    build:
      context: ./services/auth-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://auth_core:local-development-only@postgres:5432/auth_core}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-api:
    build:
      context: ./services/auth-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-auth-core}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://auth_core:local-development-only@postgres:5432/auth_core}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_KEY_HMAC_SECRET: ${REDIS_KEY_HMAC_SECRET:-local-development-key-change-me}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-local-otp-key-change-me}
      LOGIN_SIGNAL_HMAC_SECRET: ${LOGIN_SIGNAL_HMAC_SECRET:-local-login-signal-key-change-me}
      LOCAL_OIDC_SIGNING_SECRET: ${LOCAL_OIDC_SIGNING_SECRET:-local-oidc-signing-key-change-me}
      LOCAL_OIDC_FRONTEND_URL: ${LOCAL_OIDC_FRONTEND_URL:-http://localhost:3000}
      LOCAL_DATA_ENCRYPTION_KEY: ${LOCAL_DATA_ENCRYPTION_KEY:-bG9jYWwtbWZhLWtleS1jaGFuZ2UtYmVmb3JlLXByb2Q=}
      BACKUP_CODE_HMAC_SECRET: ${BACKUP_CODE_HMAC_SECRET:-local-backup-code-key-change-me}
      TOTP_ISSUER: ${TOTP_ISSUER:-Vittavaan}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Vittavaan}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:3000}
      LOCAL_CAPTCHA_TOKEN: ${LOCAL_CAPTCHA_TOKEN:-local-development-pass}
      VERIFICATION_BASE_URL: ${VERIFICATION_BASE_URL:-http://localhost:3000/verify-email}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_SENDER: ${EMAIL_SENDER:-no-reply@local.vittavaan.test}
      LOCAL_SMS_INBOX: ${LOCAL_SMS_INBOX:-sms@local.vittavaan.test}
      HIBP_USER_AGENT: ${HIBP_USER_AGENT:-Vittavaan-auth-core/0.1 security@vittavaan.test}
      REGISTRATION_PROVIDER_MODE: ${REGISTRATION_PROVIDER_MODE:-local}
      LOGIN_PROVIDER_MODE: ${LOGIN_PROVIDER_MODE:-local}
      SECRET_ENCRYPTION_MODE: ${SECRET_ENCRYPTION_MODE:-local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${AUTH_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  jwt-verifier:
    build:
      context: ./services/jwt-verifier
    environment:
      PORT: "8081"
    ports:
      - "${JWT_VERIFIER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      auth-api:
        condition: service_healthy
      jwt-verifier:
        condition: service_healthy

volumes:
  postgres_data:
