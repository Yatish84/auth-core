[project]
name = "auth-core-api"
version = "0.1.0"
description = "Vittavaan authentication and user-management API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.115.0,<1",
    "pydantic-settings>=2.7.0,<3",
    "redis>=5.2.0,<6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "mypy>=1.14.0,<2",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.25.0,<1",
    "ruff>=0.9.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["redis.asyncio.*"]
ignore_missing_imports = true
